<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger — Stock Journal & Investment Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F14;
      --panel: #121820;
      --panel-2: #171F29;
      --border: #212B36;
      --text: #E8EDF2;
      --muted: #7C8A99;
      --green: #22C55E;
      --green-dim: #163823;
      --red: #EF4444;
      --red-dim: #3A1A1A;
      --gold: #D4A73C;
      --gold-dim: #2B2413;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card-box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 28px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .brand .mark { width: 32px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, var(--gold), #8a6d1f); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk'; font-weight: 700; color: #0B0F14; font-size: 16px; }
    .brand span { font-family: 'Space Grotesk'; font-weight: 600; font-size: 20px; }
    h1 { font-family: 'Space Grotesk'; font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    p.sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 11px 12px; border-radius: 8px; font-size: 14px; font-family: 'Inter'; }
    input:focus { outline: none; border-color: var(--gold); }
    .btn { width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 8px; background: var(--gold); color: #14100a; font-weight: 600; font-size: 14px; cursor: pointer; transition: filter .15s; }
    .btn:hover { filter: brightness(1.08); }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); margin-top: 10px; }
    .btn.secondary:hover { color: var(--text); border-color: var(--gold); }
    .btn.google-btn {
      background: #FFFFFF;
      color: #1F2937;
      border: 1px solid #D1D5DB;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
      font-weight: 500;
    }
    .btn.google-btn:hover { background: #F9FAFB; }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider span { padding: 0 10px; }
    .error-text { color: var(--red); font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="center-screen">
    <div class="card-box">
      <div class="brand"><div class="mark">L</div><span>Ledger</span></div>
      <h1 id="title">Welcome Back</h1>
      <p class="sub">Log in or create an account to access your trading journal and stock portfolio.</p>
      
      {% if error %}
      <div class="error-text" id="server-error">{{ error }}</div>
      {% endif %}
      <div class="error-text" id="client-error" style="display:none;"></div>

      <button type="button" class="btn google-btn" id="google-login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider"><span>OR</span></div>
      
      <form method="POST">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="user@example.com" autocomplete="off">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••" autocomplete="off">
        <button type="submit" name="action" value="login" class="btn" id="sub-btn">Sign In</button>
        <button type="submit" name="action" value="signup" class="btn secondary">Create New Account</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAkFU5JFcQL4jM2AsYkBnp9P_YeO0dwo8",
      authDomain: "trading-app-66077.firebaseapp.com",
      projectId: "trading-app-66077",
      storageBucket: "trading-app-66077.firebasestorage.app",
      messagingSenderId: "748118708308",
      appId: "1:748118708308:web:00f8b83d8a02d0266c5dc1",
      measurementId: "G-7SMKCWFJWY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('google-login-btn').addEventListener('click', async () => {
      const errBox = document.getElementById('client-error');
      errBox.style.display = 'none';
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const idToken = await user.getIdToken();

        const res = await fetch('/api/google_login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idToken: idToken,
            email: user.email,
            localId: user.uid
          })
        });

        const data = await res.json();
        if (data.redirect) {
          window.location.href = data.redirect;
        } else if (data.error) {
          errBox.textContent = data.error;
          errBox.style.display = 'block';
        }
      } catch (error) {
        console.error("Google Auth error:", error);
        const msg = error.message || "";
        if (msg.includes("auth/unauthorized-domain")) {
          errBox.innerHTML = "<b>Domain Authorized Action Required:</b><br>" +
            "1. Open <a href='https://console.firebase.google.com/' target='_blank' style='color:#D4A73C;'>Firebase Console</a> -> Project <b>trading-app-66077</b>.<br>" +
            "2. Go to <b>Authentication</b> -> <b>Settings</b> -> <b>Authorized domains</b>.<br>" +
            "3. Click <b>Add domain</b> and add <code>127.0.0.1</code> or <code>localhost</code>.";
        } else if (msg.includes("INVALID_LOGIN_CREDENTIALS")) {
          errBox.textContent = "Invalid email or password. Please double check your credentials or click 'Create New Account'.";
        } else {
          errBox.textContent = msg || "Failed to sign in with Google.";
        }
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
